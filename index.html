<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ninja Head Roguelike</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #151814;
      color: #f4f0dc;
      font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
      width: min(100vw, 1200px);
      height: auto;
      max-height: 100vh;
      border: 3px solid #322f25;
      background: #211f1a;
      image-rendering: pixelated;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="1200" height="800"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const keys = {};

    let state = "start";
    let player;
    let zombies = [];
    let stars = [];
    let lastTime = 0;
    let spawnTimer = 0;
    let survivalTime = 0;
    let killCount = 0;

    class Player {
      constructor() {
        this.x = WIDTH / 2;
        this.y = HEIGHT / 2;
        this.radius = 28;
        this.speed = 260;
        this.maxHealth = 100;
        this.health = this.maxHealth;
      }

      update(dt) {
        let dx = 0;
        let dy = 0;

        if (keys.a) dx -= 1;
        if (keys.d) dx += 1;
        if (keys.w) dy -= 1;
        if (keys.s) dy += 1;

        if (dx !== 0 || dy !== 0) {
          const length = Math.hypot(dx, dy);
          dx /= length;
          dy /= length;
        }

        this.x += dx * this.speed * dt;
        this.y += dy * this.speed * dt;

        this.x = clamp(this.x, this.radius, WIDTH - this.radius);
        this.y = clamp(this.y, this.radius, HEIGHT - this.radius);
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
        ctx.beginPath();
        ctx.ellipse(0, 26, 25, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#070707";
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#c91f2f";
        ctx.beginPath();
        ctx.ellipse(0, -10, 27, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#0c0c0c";
        ctx.fillRect(-27, -9, 54, 16);

        ctx.fillStyle = "#c59a72";
        ctx.beginPath();
        ctx.ellipse(0, 4, 18, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#f3ead3";
        ctx.beginPath();
        ctx.arc(-8, 2, 3, 0, Math.PI * 2);
        ctx.arc(8, 2, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#17100d";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-13, -2);
        ctx.lineTo(-4, 0);
        ctx.moveTo(13, -2);
        ctx.lineTo(4, 0);
        ctx.stroke();

        ctx.restore();
      }
    }

    class Zombie {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 25;
        this.speed = 54 + Math.random() * 22;
        this.maxHealth = 90;
        this.health = this.maxHealth;
      }

      update(dt, target) {
        const dx = target.x - this.x;
        const dy = target.y - this.y;
        const distance = Math.hypot(dx, dy) || 1;

        this.x += (dx / distance) * this.speed * dt;
        this.y += (dy / distance) * this.speed * dt;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
        ctx.beginPath();
        ctx.ellipse(0, 24, 23, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#4ea43f";
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#397e30";
        ctx.beginPath();
        ctx.arc(-11, -12, 7, 0, Math.PI * 2);
        ctx.arc(12, 10, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#efe9be";
        ctx.beginPath();
        ctx.arc(-9, -3, 5, 0, Math.PI * 2);
        ctx.arc(9, -3, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#111";
        ctx.beginPath();
        ctx.arc(-8, -2, 2, 0, Math.PI * 2);
        ctx.arc(10, -4, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#173715";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-12, 11);
        ctx.lineTo(-5, 15);
        ctx.lineTo(2, 11);
        ctx.lineTo(9, 15);
        ctx.stroke();

        ctx.strokeStyle = "#2e6b28";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-19, 4);
        ctx.lineTo(-9, 9);
        ctx.moveTo(14, -17);
        ctx.lineTo(20, -7);
        ctx.stroke();

        ctx.fillStyle = "#2b1d19";
        ctx.fillRect(-24, -36, 48, 6);
        ctx.fillStyle = "#d63d36";
        ctx.fillRect(-24, -36, 48 * Math.max(this.health, 0) / this.maxHealth, 6);

        ctx.restore();
      }
    }

    class ThrowingStar {
      constructor(x, y, targetX, targetY) {
        this.x = x;
        this.y = y;
        this.radius = 12;
        this.speed = 650;
        this.damage = 46;
        this.rotation = 0;
        this.alive = true;

        const dx = targetX - x;
        const dy = targetY - y;
        const distance = Math.hypot(dx, dy) || 1;
        this.vx = (dx / distance) * this.speed;
        this.vy = (dy / distance) * this.speed;
      }

      update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.rotation += 14 * dt;

        if (
          this.x < -this.radius ||
          this.x > WIDTH + this.radius ||
          this.y < -this.radius ||
          this.y > HEIGHT + this.radius
        ) {
          this.alive = false;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        ctx.fillStyle = "#d8d8d2";
        ctx.strokeStyle = "#6f706b";
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const angle = i * Math.PI / 4;
          const radius = i % 2 === 0 ? 15 : 5;
          ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#211f1a";
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function startGame() {
      player = new Player();
      zombies = [];
      stars = [];
      spawnTimer = 0;
      survivalTime = 0;
      killCount = 0;
      state = "playing";

      for (let i = 0; i < 5; i++) {
        spawnZombie();
      }
    }

    function spawnZombie() {
      const side = Math.floor(Math.random() * 4);
      let x;
      let y;

      if (side === 0) {
        x = Math.random() * WIDTH;
        y = -30;
      } else if (side === 1) {
        x = WIDTH + 30;
        y = Math.random() * HEIGHT;
      } else if (side === 2) {
        x = Math.random() * WIDTH;
        y = HEIGHT + 30;
      } else {
        x = -30;
        y = Math.random() * HEIGHT;
      }

      zombies.push(new Zombie(x, y));
    }

    function getMousePosition(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * (WIDTH / rect.width),
        y: (event.clientY - rect.top) * (HEIGHT / rect.height)
      };
    }

    function update(dt) {
      if (state !== "playing") return;

      survivalTime += dt;
      spawnTimer += dt;

      const spawnDelay = Math.max(0.55, 1.8 - survivalTime * 0.015);
      while (spawnTimer >= spawnDelay) {
        spawnTimer -= spawnDelay;
        spawnZombie();
      }

      player.update(dt);

      for (const star of stars) {
        star.update(dt);
      }

      for (const zombie of zombies) {
        zombie.update(dt, player);

        const touchingPlayer = Math.hypot(zombie.x - player.x, zombie.y - player.y) < zombie.radius + player.radius;
        if (touchingPlayer) {
          player.health -= 32 * dt;
        }
      }

      for (const star of stars) {
        if (!star.alive) continue;

        for (const zombie of zombies) {
          if (zombie.health < 0) continue;

          const hit = Math.hypot(star.x - zombie.x, star.y - zombie.y) < star.radius + zombie.radius;
          if (hit) {
            zombie.health -= star.damage;
            star.alive = false;

            if (zombie.health < 0) {
              killCount += 1;
            }

            break;
          }
        }
      }

      stars = stars.filter(star => star.alive);
      zombies = zombies.filter(zombie => zombie.health >= 0);

      if (player.health < 0) {
        player.health = 0;
        state = "gameover";
      }
    }

    function drawBackground() {
      ctx.fillStyle = "#211f1a";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      const tileSize = 50;
      for (let y = 0; y < HEIGHT; y += tileSize) {
        for (let x = 0; x < WIDTH; x += tileSize) {
          const shade = ((x * 31 + y * 17) % 5) * 4;
          ctx.fillStyle = `rgb(${32 + shade}, ${31 + shade}, ${26 + shade})`;
          ctx.fillRect(x, y, tileSize, tileSize);
        }
      }

      ctx.strokeStyle = "rgba(12, 13, 11, 0.45)";
      ctx.lineWidth = 1;
      for (let x = 0; x <= WIDTH; x += tileSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, HEIGHT);
        ctx.stroke();
      }

      for (let y = 0; y <= HEIGHT; y += tileSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(WIDTH, y);
        ctx.stroke();
      }

      ctx.fillStyle = "rgba(96, 70, 42, 0.2)";
      for (let i = 0; i < 24; i++) {
        const x = (i * 173) % WIDTH;
        const y = (i * 97) % HEIGHT;
        ctx.fillRect(x, y, 8 + (i % 4) * 5, 4);
      }
    }

    function drawHud() {
      const healthWidth = 260;
      const healthPercent = player.health / player.maxHealth;

      ctx.fillStyle = "rgba(8, 8, 8, 0.55)";
      ctx.fillRect(22, 20, 340, 72);

      ctx.fillStyle = "#f4f0dc";
      ctx.font = "22px Arial";
      ctx.fillText("Ninja Health", 38, 48);

      ctx.fillStyle = "#3a1f1e";
      ctx.fillRect(38, 58, healthWidth, 18);

      ctx.fillStyle = healthPercent > 0.35 ? "#d73535" : "#ff7a40";
      ctx.fillRect(38, 58, healthWidth * healthPercent, 18);

      ctx.strokeStyle = "#f4f0dc";
      ctx.lineWidth = 2;
      ctx.strokeRect(38, 58, healthWidth, 18);

      ctx.fillStyle = "#f4f0dc";
      ctx.font = "20px Arial";
      ctx.fillText(`Zombies defeated: ${killCount}`, WIDTH - 240, 40);
      ctx.fillText(`Time: ${Math.floor(survivalTime)}s`, WIDTH - 240, 68);
    }

    function drawStartScreen() {
      drawBackground();

      ctx.fillStyle = "rgba(0, 0, 0, 0.62)";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      drawNinjaLogo(WIDTH / 2, 235);

      ctx.textAlign = "center";
      ctx.fillStyle = "#f4f0dc";
      ctx.font = "64px Arial";
      ctx.fillText("Ninja Head Survival", WIDTH / 2, 350);

      ctx.font = "28px Arial";
      ctx.fillText("Move with A S D W", WIDTH / 2, 415);
      ctx.fillText("Left click to throw a star toward the mouse", WIDTH / 2, 458);

      ctx.fillStyle = "#d73535";
      ctx.font = "34px Arial";
      ctx.fillText("Press SPACE to start", WIDTH / 2, 540);
      ctx.textAlign = "left";
    }

    function drawGameOverScreen() {
      drawBackground();

      for (const star of stars) star.draw();
      for (const zombie of zombies) zombie.draw();
      if (player) player.draw();

      ctx.fillStyle = "rgba(0, 0, 0, 0.72)";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.textAlign = "center";
      ctx.fillStyle = "#d73535";
      ctx.font = "76px Arial";
      ctx.fillText("Game Over", WIDTH / 2, 325);

      ctx.fillStyle = "#f4f0dc";
      ctx.font = "30px Arial";
      ctx.fillText(`You survived ${Math.floor(survivalTime)} seconds`, WIDTH / 2, 395);
      ctx.fillText(`Zombies defeated: ${killCount}`, WIDTH / 2, 438);

      ctx.fillStyle = "#d73535";
      ctx.font = "32px Arial";
      ctx.fillText("Press SPACE to try again", WIDTH / 2, 525);
      ctx.textAlign = "left";
    }

    function drawNinjaLogo(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(2.2, 2.2);
      const logoPlayer = { x: 0, y: 0, radius: 28 };

      ctx.fillStyle = "#070707";
      ctx.beginPath();
      ctx.arc(logoPlayer.x, logoPlayer.y, logoPlayer.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#c91f2f";
      ctx.beginPath();
      ctx.ellipse(0, -10, 27, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#0c0c0c";
      ctx.fillRect(-27, -9, 54, 16);

      ctx.fillStyle = "#c59a72";
      ctx.beginPath();
      ctx.ellipse(0, 4, 18, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#f3ead3";
      ctx.beginPath();
      ctx.arc(-8, 2, 3, 0, Math.PI * 2);
      ctx.arc(8, 2, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function draw() {
      if (state === "start") {
        drawStartScreen();
        return;
      }

      if (state === "gameover") {
        drawGameOverScreen();
        return;
      }

      drawBackground();

      for (const star of stars) {
        star.draw();
      }

      for (const zombie of zombies) {
        zombie.draw();
      }

      player.draw();
      drawHud();
    }

    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000 || 0, 0.05);
      lastTime = timestamp;

      update(dt);
      draw();

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();
      keys[key] = true;

      if (event.code === "Space") {
        event.preventDefault();
        if (state === "start" || state === "gameover") {
          startGame();
        }
      }
    });

    window.addEventListener("keyup", event => {
      keys[event.key.toLowerCase()] = false;
    });

    canvas.addEventListener("mousedown", event => {
      if (event.button !== 0 || state !== "playing") return;

      const mouse = getMousePosition(event);
      stars.push(new ThrowingStar(player.x, player.y, mouse.x, mouse.y));
    });

    drawStartScreen();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
